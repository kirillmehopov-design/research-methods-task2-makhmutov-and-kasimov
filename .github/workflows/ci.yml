name: Copilot study checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build image and run tests
        run: docker build -t copilot-mode-study .
      - name: Analyze published data
        run: docker run --rm copilot-mode-study
